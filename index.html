<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Diver</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #062a4a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w, h;
function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
addEventListener("resize", resize);
resize();

const diver = { x: w / 2, y: h / 2, face: 1, t: 0 };
const target = { x: w / 2, y: h / 2 };
const bubbles = [];

function aim(e) {
  const p = e.touches ? e.touches[0] : e;
  target.x = p.clientX;
  target.y = p.clientY;
}
addEventListener("mousemove", aim);
addEventListener("touchstart", aim, { passive: true });
addEventListener("touchmove", aim, { passive: true });

function drawDiver() {
  const kick = Math.sin(diver.t * 0.2) * 6;
  ctx.save();
  ctx.translate(diver.x, diver.y);
  ctx.scale(diver.face, 1);

  ctx.fillStyle = "#f4b400";
  ctx.beginPath(); ctx.ellipse(-4, 0, 26, 15, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#ff7043";
  ctx.beginPath(); ctx.ellipse(-30, kick, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-30, -kick, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#cfd8dc";
  ctx.fillRect(-14, -22, 12, 12);

  ctx.fillStyle = "#e0e0e0";
  ctx.beginPath(); ctx.arc(24, -2, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#4fc3f7";
  ctx.beginPath(); ctx.arc(28, -3, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.beginPath(); ctx.arc(30, -6, 2.5, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function frame() {
  const dx = target.x - diver.x, dy = target.y - diver.y;
  diver.x += dx * 0.04;
  diver.y += dy * 0.04;
  if (Math.abs(dx) > 8) diver.face = dx > 0 ? 1 : -1;
  diver.t++;

  if (diver.t % 8 === 0) {
    bubbles.push({
      x: diver.x + diver.face * 34, y: diver.y - 6,
      r: 2 + Math.random() * 5, drift: Math.random() * 6.28, life: 1
    });
  }
  for (const b of bubbles) {
    b.y -= 0.8 + b.r * 0.12;
    b.drift += 0.05;
    b.x += Math.sin(b.drift) * 0.6;
    b.life -= 0.004;
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    if (bubbles[i].life <= 0 || bubbles[i].y < -10) bubbles.splice(i, 1);
  }

  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#4fc3f7");
  g.addColorStop(1, "#062a4a");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  for (const b of bubbles) {
    ctx.globalAlpha = Math.max(b.life, 0);
    ctx.strokeStyle = "#ffffff";
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  drawDiver();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
